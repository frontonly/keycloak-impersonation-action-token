name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0, no leading "v")'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0 (got '${{ inputs.version }}')"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set project version
        run: ./mvnw -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Build jars
        run: |
          mkdir -p dist
          ./mvnw -B clean package
          cp target/twobiers.keycloak-keycloak-impersonation-action-token.jar dist/
          # The 26.6 line has its own source root and jar name (see pom.xml / README).
          ./mvnw -B clean package -Pkeycloak-26.6
          cp target/twobiers.keycloak-keycloak-impersonation-action-token-26.6.jar dist/
          ls -l dist

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: |
            Provider jars, one per Keycloak line:

            | Asset | Keycloak |
            | --- | --- |
            | `twobiers.keycloak-keycloak-impersonation-action-token.jar` | 26.7.x and newer |
            | `twobiers.keycloak-keycloak-impersonation-action-token-26.6.jar` | 26.6.x |

            The two jars differ only in how a redeemed action token is revoked: 26.7 moved that to the
            `RevokedTokenProvider` added in that release, which does not exist on 26.6. See the README's
            installation section.
          generate_release_notes: true
          files: dist/*.jar

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maven-logs
          path: |
            target/surefire-reports/
            target/*.log
